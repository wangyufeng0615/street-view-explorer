services:
  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
      args:
        - FRONTEND_BUILD_CONTEXT=./frontend
    image: streetview-nginx:latest
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    image: streetview-backend:latest
    env_file:
      - ./backend/.env
    environment:
      - SQLITE_PATH=/app/data/streetview.db
    volumes:
      - sqlite_data:/app/data
    expose:
      - "8080"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

volumes:
  sqlite_data:
