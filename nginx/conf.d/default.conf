# 开启gzip压缩
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/rss+xml application/atom+xml image/svg+xml application/x-javascript application/x-font-ttf application/vnd.ms-fontobject font/opentype;
gzip_disable "msie6";
gzip_comp_level 6;

# 客户端请求大小限制
client_max_body_size 10M;
client_body_buffer_size 128k;

# Street view image cache (images are immutable — same pano+heading always returns the same image)
proxy_cache_path /var/cache/nginx/streetview levels=1:2 keys_zone=streetview:10m max_size=500m inactive=7d;

server {
    listen 3000;
    server_name localhost;

    # 设置允许的域名
    set $allowed_origin "";
    if ($http_origin ~ ^https://(earth\.wangyufeng\.org|yoloyolo\.earth)$) {
        set $allowed_origin $http_origin;
    }

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # 前端静态资源
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        
        # 浏览器每次复核；CDN 可短暂缓存并后台更新。静态资源文件名带 hash，
        # 因此短时 edge cache 不会把新旧 JS/CSS 混在一起。
        location = /index.html {
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
            add_header CDN-Cache-Control "public, s-maxage=300, stale-while-revalidate=60" always;
            add_header Cloudflare-CDN-Cache-Control "public, s-maxage=300, stale-while-revalidate=60" always;
        }
        
        # 静态资源强缓存（JS、CSS、图片等）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        
        # Content Security Policy
        set $CSP "script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.googleapis.com https://*.gstatic.com https://*.cloudflareinsights.com https://static.cloudflareinsights.com; script-src-elem 'self' 'unsafe-inline' 'unsafe-eval' https://*.googleapis.com https://*.gstatic.com https://*.cloudflareinsights.com https://static.cloudflareinsights.com;";
        add_header Content-Security-Policy $CSP always;
    }

    # Street view image proxy — cached at nginx level
    location /api/v1/agent/streetview {
        proxy_pass http://backend:8080/api/v1/agent/streetview;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Enable buffering for caching (images are small: 50-100KB)
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 128k;

        # Cache config
        proxy_cache streetview;
        proxy_cache_key "$arg_pano_id:$arg_heading:$arg_pitch:$arg_fov";
        proxy_cache_valid 200 7d;
        proxy_cache_methods GET;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # CORS headers
        add_header 'Access-Control-Allow-Origin' $allowed_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Session-ID' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    }

    # Atlas Voice Realtime WebSocket
    location /api/v1/realtime/ws {
        proxy_pass http://backend:8080/api/v1/realtime/ws;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # API 代理
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        
        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # 代理超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 缓冲设置
        proxy_buffering off;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # CORS headers
        add_header 'Access-Control-Allow-Origin' $allowed_origin always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Session-ID' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # OPTIONS预检请求处理
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $allowed_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Session-ID' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }
    
    # 健康检查端点
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }
    
    # 日志格式
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;
}
