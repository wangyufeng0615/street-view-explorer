<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    
    <!-- Primary Meta Tags -->
    <title>Atlas</title>
    <meta name="title" content="Explore Earth with AI" />
    <meta name="description" content="Explore random street views from around the world with AI-powered cultural and historical insights. Discover hidden gems, learn about local culture, and travel virtually through Google Street View." />
    <meta name="keywords" content="street view, random location, travel, explore, world map, cultural insights, virtual travel, global exploration, AI travel guide, Google Street View" />
    <meta name="author" content="yufeng" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="en" />
    <meta name="revisit-after" content="7 days" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://earth.wangyufeng.org/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://earth.wangyufeng.org/" />
    <meta property="og:title" content="Explore Earth with AI" />
    <meta property="og:description" content="Explore random street views from around the world with AI-powered cultural and historical insights. Discover hidden gems and travel virtually." />
    <meta property="og:image" content="https://earth.wangyufeng.org/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Street View Explorer" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="zh_CN" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://earth.wangyufeng.org/" />
    <meta property="twitter:title" content="Explore Earth with AI" />
    <meta property="twitter:description" content="Explore random street views from around the world with AI-powered cultural and historical insights. Discover hidden gems and travel virtually." />
    <meta property="twitter:image" content="https://earth.wangyufeng.org/twitter-image.jpg" />
    <meta property="twitter:creator" content="@streetviewexp" />
    
    <!-- Additional SEO Meta Tags -->
    <meta name="theme-color" content="#4285F4" />
    <meta name="msapplication-TileColor" content="#4285F4" />
    <meta name="application-name" content="Explore Earth with AI" />
    <meta name="apple-mobile-web-app-title" content="Explore Earth with AI" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <!-- Favicon -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Street View Explorer",
      "description": "Explore random street views from around the world with AI-powered cultural and historical insights",
      "url": "https://earth.wangyufeng.org/",
      "applicationCategory": "TravelApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "creator": {
        "@type": "Organization",
        "name": "Street View Explorer Team"
      },
      "featureList": [
        "Random street view exploration",
        "AI-powered location insights",
        "Global map visualization",
        "Cultural and historical information",
        "Multi-language support"
      ]
    }
    </script>
    
    <!-- Production-only external font hints. Local dev keeps browser egress behind the configured proxy. -->
    <script>
        if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
            [
                ['dns-prefetch', 'https://fonts.googleapis.com'],
                ['dns-prefetch', 'https://fonts.gstatic.com'],
                ['preconnect', 'https://fonts.googleapis.com'],
                ['preconnect', 'https://fonts.gstatic.com', true],
            ].forEach(([rel, href, crossOrigin]) => {
                const link = document.createElement('link');
                link.rel = rel;
                link.href = href;
                if (crossOrigin) link.crossOrigin = '';
                document.head.appendChild(link);
            });
            const font = document.createElement('link');
            font.rel = 'stylesheet';
            font.href = 'https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;500;600&display=swap';
            document.head.appendChild(font);
        }
    </script>
    
    <!-- Inline critical font CSS for immediate text rendering -->
    <style>
        /* Fallback font stack while Comfortaa loads */
        body {
            font-family: 'Comfortaa', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        }
    </style>
    
    <!-- Cloudflare Web Analytics is injected at the edge in production. -->
</head>
<body>
    <div id="root"></div>
    <!-- Vite entry point -->
    <script type="module" src="/src/index.tsx"></script>
</body>
</html>
